name: CI
on:
  push:
    branches: ["feature/**", "master"]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: ruff check backend tests
      - run: mypy backend --follow-imports=silent
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-analyst-token/example-analyst-token-at-least-24-characters/g; s/replace-with-a-long-random-manager-token/example-manager-token-at-least-24-characters/g; s/replace-with-a-long-random-signing-key/example-signing-key-at-least-32-characters/g' .env
          docker compose up -d --build --wait
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -H 'Authorization: Bearer example-analyst-token-at-least-24-characters' http://127.0.0.1:8000/api/dashboard
          set -a
          . ./.env
          set +a
          python3 scripts/smoke_workflow.py
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -c playwright.live.config.ts
        working-directory: frontend
        env:
          DEMO_MANAGER_TOKEN: example-manager-token-at-least-24-characters
          DEMO_ANALYST_TOKEN: example-analyst-token-at-least-24-characters
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: procurement-playwright-trace
          path: frontend/test-results
      - if: failure()
        run: docker compose logs --no-color api db frontend
      - if: always()
        run: docker compose down -v
  public-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: |
          cat > .env <<'EOF'
          DEMO_DOMAIN=http://127.0.0.1
          POSTGRES_PASSWORD=ci-demo-db-password
          DATABASE_URL=postgresql+psycopg://hub:ci-demo-db-password@db:5432/hub
          MCP_SIGNING_KEY=ci-demo-signing-key-with-at-least-32-characters
          DEMO_COOKIE_SECURE=false
          EOF
          docker compose --env-file .env -f deploy/compose.yaml up -d --build --wait
          curl --retry 10 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1/api/demo/config
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test -c playwright.public.config.ts
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-demo-playwright-trace
          path: frontend/test-results
      - if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml logs --no-color api db web
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml down -v
