name: CI
on:
  push:
    branches: ["feature/**", "master"]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e '.[dev]'
      - run: ruff check backend tests
      - run: mypy backend --follow-imports=silent
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-analyst-token/example-analyst-token-at-least-24-characters/g; s/replace-with-a-long-random-manager-token/example-manager-token-at-least-24-characters/g; s/replace-with-a-long-random-signing-key/example-signing-key-at-least-32-characters/g' .env
          docker compose up -d --build --wait
          curl -fsS http://localhost:8000/health
          curl -fsS -H 'Authorization: Bearer example-analyst-token-at-least-24-characters' http://localhost:8000/api/dashboard
      - if: always()
        run: docker compose down -v
