# Use with: docker compose --env-file .env -f deploy/compose.yaml up -d --build --wait
# This is a standalone public *simulation*. Only the gateway publishes ports.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a private database password}
      POSTGRES_DB: hub
    volumes:
      - hub_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 10s
      retries: 12
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set a private PostgreSQL URL}
      MCP_SIGNING_KEY: ${MCP_SIGNING_KEY:?set a random signing key}
      PUBLIC_DEMO_MODE: "true"
      DEMO_COOKIE_SECURE: ${DEMO_COOKIE_SECURE:-true}
      DEMO_COOKIE_PATH: /operations/
      OPENAI_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      retries: 12
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?set your public domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  hub_data:
  caddy_data:
  caddy_config:
